<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Забронированные вами подарки</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/gifts.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-logo">
                <a href="/">
                    <img src="images/header-logo.svg" alt="WishCraft" class="light-theme-icon">
                    <img src="images/header-logo-dark-theme.svg" alt="WishCraft" class="dark-theme-icon">
                </a>
            </div>
            <div class="header-controls">
                <button class="button-icon" type="button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы" class="light-theme-icon">
                    <img src="images/light-theme-icon.svg" alt="Смена темы" class="dark-theme-icon">
                </button>
                <nav class="menu">
                    <button type="button">
                        <img src="images/default-avatar.svg" alt="Меню профиля" class="light-theme-icon">
                        <img src="images/default-avatar-dark-theme.svg" alt="Меню профиля" class="dark-theme-icon">
                    </button>
                    <div class="dropdown">
                        <a href="profile.html" class="dropdown-item">Профиль</a>
                        <a href="my-wishlists.html" class="dropdown-item">Мои вишлисты</a>
                        <a href="notifications.html" class="dropdown-item">Уведомления</a>
                        <a href="friends.html" class="dropdown-item">Друзья</a>
                        <a href="reserved-gifts.html" class="dropdown-item">Забронированные подарки</a>
                        <div class="dropdown-divider"></div>   
                        <a href="/" class="dropdown-item">Выход</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="reserved-gifts">
            <div class="wrapper">
                <div id="reserved-gifts-header">
                    <h1 class="large-headline">Забронированные вами подарки</h1>
                </div>
                <div class="reserved-gifts-content">
                    <div class="wishlist-controls box">
                        <div class="wishlist-sort">
                            <p>Сортировать</p>
                            <select id="gifts-sort-select" name="gifts-sort">
                                <option value="cheap-first">сначала дешевле</option>
                                <option value="expensive-first">сначала дороже</option>
                                <option value="date-added">по дате добавления</option>
                            </select>
                        </div>
                        <fieldset class="wishlist-filter">
                            <legend>Показать</legend>
                            <div class="wishlist-filter-choice">
                                <input type="radio" name="wishlist-filter-choice" value="all" id="choice-all" checked>
                                <label for="choice-all">Все</label>
                            </div>
                            <div class="wishlist-filter-choice">
                                <input type="radio" name="wishlist-filter-choice" value="bought-only" id="choice-bought-only">
                                <label for="choice-bought-only">Только приобретенные</label>
                            </div>
                            <div class="wishlist-filter-choice">
                                <input type="radio" name="wishlist-filter-choice" value="not-bought-only" id="choice-not-bought-only">
                                <label for="choice-not-bought-only">Только неприобретенные</label>
                            </div>
                        </fieldset>
                    </div>
                    <div class="gifts-container">
                        <article class="gift box">
                            <div class="gift-image-container">
                                <img src="images/watch-image.png" class="gift-image" alt="Фото подарка">
                                <div class="wishlist-owner-info box">
                                    <img src="images/default-avatar.svg" alt="Изображение профиля" class="light-theme-icon">
                                    <img src="images/default-avatar-dark-theme.svg" alt="Изображение профиля" class="dark-theme-icon">
                                    <a href="#" class="overlay-link"></a>
                                    <div>
                                        <h3 class="extra-small-headline">Олег</h3>
                                        <p class="text-accent">День рождения</p>
                                    </div>
                                </div>
                            </div>
                            <div class="gift-body">
                                <div class="gift-header">
                                    <div class="gift-header-info">
                                        <h2 class="small-headline">Часы</h2>
                                        <p class="text-accent">3800р</p>
                                    </div>
                                    <div class="gift-header-actions">
                                        <button type="button" class="button-icon">
                                            <img src="images/action-menu-icon.svg" alt="Меню" class="light-theme-icon">
                                            <img src="images/action-menu-icon-dark-theme.svg" alt="Меню" class="dark-theme-icon">
                                        </button>
                                    </div>
                                </div>
                                <div class="gift-actions">
                                    <button type="button" class="button button-danger">Отмена брони</button>
                                    <a href="#" class="button button-regular">В магазин</a>
                                </div>
                            </div>
                        </article>
                        <article class="gift box">
                            <div class="gift-image-container">
                                <img src="images/speaker-image.png" class="gift-image" alt="Фото подарка">
                                <div class="wishlist-owner-info box">
                                    <img src="images/default-avatar.svg" alt="Изображение профиля" class="light-theme-icon">
                                    <img src="images/default-avatar-dark-theme.svg" alt="Изображение профиля" class="dark-theme-icon">
                                    <div>
                                        <a href="#" class="overlay-link"></a>
                                        <h3 class="extra-small-headline">Олег</h3>
                                        <p class="text-accent">День рождения</p>
                                    </div>
                                </div>
                            </div>
                            <div class="gift-body">
                                <div class="gift-header">
                                    <div class="gift-header-info">
                                        <h2 class="small-headline">Колонка</h2>
                                        <p class="text-accent">3400р</p>
                                    </div>
                                    <div class="gift-header-actions">
                                        <button type="button" class="button-icon">
                                            <img src="images/action-menu-icon.svg" alt="Меню" class="light-theme-icon">
                                            <img src="images/action-menu-icon-dark-theme.svg" alt="Меню" class="dark-theme-icon">
                                        </button>
                                    </div>
                                </div>
                                <div class="gift-actions">
                                    <button type="button" class="button button-danger">Отмена брони</button>
                                    <a href="#" class="button button-regular">В магазин</a>
                                </div>
                            </div>
                        </article>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="footer-logo">
                <a href="/">
                    <img src="images/footer-logo.svg" alt="WishCraft" class="light-theme-icon">
                    <img src="images/footer-logo-dark-theme.svg" alt="WishCraft" class="dark-theme-icon">
                </a>
            </div>
            <small class="copyright">&copy; WishCraft 2025</small>
        </div>
    </footer>
</body>
</html>
