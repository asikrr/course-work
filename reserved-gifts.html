<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Забронированные вами</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-logo">
                <a href="/"><img src="images/header-logo.svg" alt="WishCraft"></a>
            </div>
            <div class="header-controls">
                <button class="button-icon" type="button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы">
                </button>
                <nav class="menu">
                    <button type="button"><img src="images/default-avatar.svg" alt="Изображение профиля"></button>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="reserved-gifts">
            <div class="wrapper">
                <div id="reserved-gifts-header">
                    <h1>Забронированные вами подарки</h1>
                </div>
                <div class="reserved-gifts">
                    <div class="wishlist-controls box">
                        <div class="wishlist-sort">
                            <p>Сортировать</p>
                            <select>
                                <option>сначала дешевле</option>
                                <option>сначала дороже</option>
                                <option>по дате мероприятия</option>
                            </select>
                        </div>
                        <div class="wishlist-filter">
                            <p>Показать</p>
                            <div class="wishlist-filter-choices">
                                <div class="wishlist-filter-choice">
                                    <input type="radio" name="wishlist-filter-choice" value="all" id="choice-all">
                                    <label for="choice-all">Все</label>
                                </div>
                                <div class="wishlist-filter-choice">
                                    <input type="radio" name="wishlist-filter-choice" value="bought-only" id="choice-bought-only">
                                    <label for="choice-bought-only">Только приобретенные</label>
                                </div>
                                <div class="wishlist-filter-choice">
                                    <input type="radio" name="wishlist-filter-choice" value="not-bought-only" id="choice-not-bought-only">
                                    <label for="choice-not-bought-only">Только неприобретенные</label>
                                </div>    
                            </div>
                        </div>
                    </div>
                    <div class="gifts-container">
                        <article class="gift box">
                            <div class="gift-image">
                                <img src="images/gift-icon.svg">
                                <div class="gift-wishlist-info box">
                                    <img src="images/default-avatar.svg">
                                    <div>
                                        <h4>Олег</h4>
                                        <p>День рождения</p>
                                    </div>
                                </div>
                            </div>
                            <div class="gift-body">
                                <div class="gift-content">
                                    <div class="gift-header">
                                        <div class="gift-header-info">
                                            <h3 class="gift-title">Часы</h3>
                                            <p class="gift-price text-accent">3800р</p>
                                        </div>
                                        <div class="gift-header-actions">
                                            <button type="button" class="button-icon">
                                                <img src="images/action-menu-icon.svg">
                                            </button>
                                        </div>
                                    </div>
                                    <div class="gift-comment">
                                        <p>Комментарий</p>
                                        <button type="button" class="button-icon">
                                            <img src="images/arrow-icon.svg">
                                        </button>
                                    </div>
                                </div>
                                <div class="gift-actions">
                                    <button type="button" class="button button-red">Отмена брони</button>
                                    <a href="#" class="button button-purple">Перейти в магазин</a>
                                </div>
                            </div>
                        </article>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="footer-logo">
                <a href="/"><img src="images/footer-logo.svg" alt="WishCraft"></a>
            </div>
            <p>&copy; WishCraft 2025</p>
        </div>
    </footer>
</body>
</html>
