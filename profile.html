<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-logo">
                <a href="/"><img src="images/header-logo.svg" alt="WishCraft"></a>
            </div>
            <div class="header-controls">
                <button class="button-icon" type="button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы">
                </button>
                <nav class="menu">
                    <button type="button"><img src="images/default-avatar.svg" alt="Изображение профиля"></button>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="profile">
            <div class="wrapper">
                <h1>Профиль</h1>
                <div class="profile-content">
                    <div class="account-info box">
                        <img class="profile-picture" src="images/default-avatar.svg" alt="Изображение профиля">
                    </div>
                    <div class="settings box">
                        <h3>Настройки</h3>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="footer-logo">
                <a href="/"><img src="images/footer-logo.svg" alt="WishCraft"></a>
            </div>
            <p>&copy; WishCraft 2025</p>
        </div>
    </footer>
</body>
</html>
