<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-logo">
                <a href="/"><img src="images/header-logo.svg" alt="WishCraft"></a>
            </div>
            <div class="header-controls">
                <button class="button-icon" type="button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы">
                </button>
                <nav class="menu">
                    <button type="button"><img src="images/default-avatar.svg" alt="Изображение профиля"></button>
                    <div class="dropdown">
                        <a href="profile.html" class="dropdown-item">Профиль</a>
                        <a href="my-wishlists.html" class="dropdown-item">Мои вишлисты</a>
                        <a href="notifications.html" class="dropdown-item">Уведомления</a>
                        <a href="friend-list.html" class="dropdown-item">Друзья</a>
                        <a href="reserved-gifts.html" class="dropdown-item">Забронированные подарки</a>
                        <div class="dropdown-divider"></div>   
                        <a href="/" class="dropdown-item logout">Выход</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="profile">
            <div class="wrapper">
                <h1 class="large-headline">Профиль</h1>
                <div class="profile-content">
                    <div class="user-info box">
                        <img class="profile-picture" src="images/default-avatar.svg" alt="Изображение профиля">
                        <div class="user-details">
                            <h2 class="medium-headline">Ася</h2>
                            <p>pochta@gmail.com</p>
                            <button class="button button-accent" type="button">Редактировать</button>
                            <a href="/" class="text-accent">Выйти из аккаунта</a>
                        </div>
                    </div>
                    <div class="account-info">
                        <div class="account-statistic">
                            <div class="account-statistic-item box">
                                <a href="my-wishlists.html" class="overlay-link"></a>
                                <img src="images/list-icon.svg" alt="Иконка списка">
                                <p>13 вишлистов</p>
                            </div>
                            <div class="account-statistic-item box">
                                <a href="friend-list.html" class="overlay-link"></a>
                                <img src="images/default-avatar.svg" alt="Иконка профиля">
                                <p>3 друга</p>
                            </div>
                            <div class="account-statistic-item box">
                                <a href="reserved-gifts.html" class="overlay-link"></a>
                                <img src="images/gift-in-hand-icon.svg" alt="Иконка подарка">
                                <p>2 подарка забронировано</p>
                            </div>
                        </div>
                        <div class="account-control box">
                            <div class="account-settings">
                                <h3 class="small-headline">Настройки</h3>
                                <label class="switch">
                                    Получать уведомления о забронированных подарках на Email
                                    <input type="checkbox">
                                    <span class="slider"></span>
                                </label>
                                <label class="switch">
                                    Получать новости об изменениях на сайте на Email
                                    <input type="checkbox">
                                    <span class="slider"></span>
                                </label>
                            </div>
                            <div class="account-safety">
                                <h3 class="small-headline">Безопасность</h3>
                                <a href="#" class="text-accent">Сбросить пароль</a>
                                <a href="#" class="text-danger">Удалить аккаунт</a> 
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="footer-logo">
                <a href="/"><img src="images/footer-logo.svg" alt="WishCraft"></a>
            </div>
            <p>&copy; WishCraft 2025</p>
        </div>
    </footer>
</body>
</html>
