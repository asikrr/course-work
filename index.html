<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-left">
                <img src="images/header-logo.svg" alt="Логотип">
            </div>
            <div class="header-center">
                <button class="theme-change-button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы">
                </button>
            </div>
            <div class="header-right">
                <nav>
                    <a href="/" id="login-link">Войти</a>
                    <a href="/" id="register-link">Зарегистрироваться</a>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section id="main-screen">
            <div class="wrapper">
                <div id="main-screen-content">
                    <div id="main-screen-content-text">
                        <h1>WishCraft</h1>
                        <p>Создавайте списки желаний и делитесь мечтами с близкими</p>
                    </div>       
                    <a href="/" id="wishlist-create-link">Создать список</a>
                </div>
            </div>
        </section>
        <section id="site-description">
            <div class="wrapper">

            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="logo-container">
                <img src="images/footer-logo.svg">
            </div>
            <p>&copy;WishCraft 2025</p>
        </div>
    </footer>
</body>
</html>
