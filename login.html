<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-left">
                <a href="/"><img src="images/header-logo.svg" alt="Логотип"></a>
            </div>
            <div class="header-center">
                <button class="theme-change-button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы">
                </button>
            </div>
            <div class="header-right">
                <nav>
                    <a href="login.html" class="purple-border-button">Войти</a>
                    <a href="register.html" class="yellow-button">Зарегистрироваться</a>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section id="register">
            <div class="wrapper">
                <div class="register-container">
                    <h1>Вход</h1>
                    <div id="register-form-container">
                        <form id="register-form">
                            <div class="form-fields">
                                <div class="form-field">
                                    <label for="email">Email</label>
                                    <input type="email" id="email" name="email">
                                </div>
                                <div class="form-field">
                                    <label for="password1">Пароль</label>
                                    <input type="password" id="password1" name="password1">
                                </div>
                            </div>
                            <button type="submit" id="login-button">Войти</button>
                        </form>
                        <p>Еще нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
                    </div>
                </div>
                <div class="register-image"></div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="logo-container">
                <a href="/"><img src="images/footer-logo.svg"></a>
            </div>
            <p>&copy;WishCraft 2025</p>
        </div>
    </footer>
</body>
</html>
