<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-logo">
                <a href="/"><img src="images/header-logo.svg" alt="WishCraft"></a>
            </div>
            <div class="header-controls">
                <button class="button-icon" type="button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы">
                </button>
                <nav class="menu">
                    <a href="login.html" class="button button-purple-border">Войти</a>
                    <a href="register.html" class="button button-yellow">Зарегистрироваться</a>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="login">
            <div class="wrapper">
                <div class="box">
                    <div class="authentication-container">
                        <h1>Вход</h1>
                        <div class="authentication-form-container">
                            <form id="login-form">
                                <div class="form-fields">
                                    <div class="form-field">
                                        <label for="email">Email</label>
                                        <input type="email" id="email" name="email">
                                    </div>
                                    <div class="form-field">
                                        <label for="password">Пароль</label>
                                        <input type="password" id="password" name="password">
                                    </div>
                                </div>
                                <button type="submit" id="login-button" class="button button-yellow">Войти</button>
                            </form>
                            <p>Еще нет аккаунта? <a href="register.html" class="text-accent">Зарегистрироваться</a></p>
                        </div>
                    </div>
                    <div class="authentication-image-container">
                        <img src="images/authentication-image.png">
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="footer-logo">
                <a href="/"><img src="images/footer-logo.svg" alt="WishCraft"></a>
            </div>
            <p>&copy; WishCraft 2025</p>
        </div>
    </footer>
</body>
</html>
