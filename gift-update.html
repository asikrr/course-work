<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование подарка</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/gift-form.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-logo">
                <a href="/">
                    <img src="images/header-logo.svg" alt="WishCraft" class="light-theme-icon">
                    <img src="images/header-logo-dark-theme.svg" alt="WishCraft" class="dark-theme-icon">
                </a>
            </div>
            <div class="header-controls">
                <button class="button-icon" type="button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы" class="light-theme-icon">
                    <img src="images/light-theme-icon.svg" alt="Смена темы" class="dark-theme-icon">
                </button>
                <nav class="menu">
                    <button type="button">
                        <img src="images/default-avatar.svg" alt="Меню профиля" class="light-theme-icon">
                        <img src="images/default-avatar-dark-theme.svg" alt="Меню профиля" class="dark-theme-icon">
                    </button>
                    <div class="dropdown">
                        <a href="profile.html" class="dropdown-item">Профиль</a>
                        <a href="my-wishlists.html" class="dropdown-item">Мои вишлисты</a>
                        <a href="notifications.html" class="dropdown-item">Уведомления</a>
                        <a href="friend-list.html" class="dropdown-item">Друзья</a>
                        <a href="reserved-gifts.html" class="dropdown-item">Забронированные подарки</a>
                        <div class="dropdown-divider"></div>   
                        <a href="/" class="dropdown-item logout">Выход</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="gift-update">
            <div class="wrapper">
                <h1 class="large-headline">Редактирование подарка</h1>
                <form class="gift-form box" id="gift-update-form" enctype="multipart/form-data" method="post" class="box">
                    <div class="form-column-image">
                        <div class="image-upload-container">
                            <label for="gift-image-input" class="gift-image-label">
                                <img src="images/add-photo-icon.svg" alt="Добавить фото">
                            </label>
                            <input type="file" id="gift-image-input" name="gift-image" accept="image/*">
                        </div>
                    </div>
                    <div class="form-column-content">
                        <div class="form-fields">
                            <div class="form-field">
                                <label for="title">Название <span class="text-accent">*</span></label>
                                <input type="text" id="title" name="title" value="Кружка" required>
                            </div>
                            <div class="form-field">
                                <label for="gift-link">Ссылка на товар</label>
                                <input type="text" id="gift-link" name="gift-link" value="https://www.ozon.ru/product/">
                            </div>
                            <div class="price-container">
                                <div class="form-field">
                                    <label for="price">Цена</label>
                                    <input type="text" id="price" name="price" value="500">
                                </div>
                                <select class="currency-select">
                                    <option value="RUB">₽</option>
                                    <option value="USD">$</option>
                                    <option value="EUR">€</option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label for="gift-comment">Комментарий к подарку</label>
                                <textarea name="gift-comment" id="gift-comment"></textarea>
                            </div>
                            <div class="checkbox-container">
                                <input type="checkbox" id="priority-choice" name="priority">
                                <label for="priority-choice">Приоритетный товар</label>
                            </div>
                        </div>
                        <button type="submit" class="button button-accent">Сохранить</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="footer-logo">
                <a href="/">
                    <img src="images/footer-logo.svg" alt="WishCraft" class="light-theme-icon">
                    <img src="images/footer-logo-dark-theme.svg" alt="WishCraft" class="dark-theme-icon">
                </a>
            </div>
            <small class="copyright">&copy; WishCraft 2025</small>
        </div>
    </footer>
</body>
</html>
