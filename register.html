<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/authentication.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-logo">
                <a href="/">
                    <img src="images/header-logo.svg" alt="WishCraft" class="light-theme-icon">
                    <img src="images/header-logo-dark-theme.svg" alt="WishCraft" class="dark-theme-icon">
                </a>
            </div>
            <div class="header-controls">
                <button class="button-icon" type="button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы" class="light-theme-icon">
                    <img src="images/light-theme-icon.svg" alt="Смена темы" class="dark-theme-icon">
                </button>
                <nav class="menu">
                    <a href="login.html" class="button button-regular-border">Войти</a>
                    <a href="register.html" class="button button-accent">Зарегистрироваться</a>
                    <div class="burger-menu">
                        <button class="burger-button" type="button">
                            <img src="images/burger-menu-icon.svg" alt="Меню" class="light-theme-icon">
                            <img src="images/burger-menu-icon-dark-theme.svg" alt="Меню" class="dark-theme-icon">
                        </button>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="authentication">
            <div class="wrapper">
                <div class="box">
                    <div class="authentication-container">
                        <h1 class="large-headline">Регистрация</h1>
                        <div class="authentication-form-container">
                            <form id="register-form" method="post">
                                <div class="form-fields">
                                    <div class="form-field">
                                        <label for="username">Имя <span class="text-accent">*</span></label>
                                        <input type="text" id="username" name="username" required>
                                    </div>
                                    <div class="form-field">
                                        <label for="email">Email <span class="text-accent">*</span></label>
                                        <input type="email" id="email" name="email" required>
                                    </div>
                                    <div class="form-field">
                                        <label for="password1">Пароль <span class="text-accent">*</span></label>
                                        <input type="password" id="password1" name="password1" required>
                                    </div>
                                    <div class="form-field">
                                        <label for="password2">Подтвердите пароль <span class="text-accent">*</span></label>
                                        <input type="password" id="password2" name="password2" required>
                                    </div>
                                </div>
                                <button type="submit" id="register-button" class="button button-accent">Зарегистрироваться</button>
                            </form>
                            <p>Уже зарегистрированы? <a href="login.html" class="text-accent">Войти</a></p>
                        </div>
                    </div>
                    <div class="authentication-image-container">
                        <img src="images/authentication-image.png" alt="Изображение страницы регистрации">
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="footer-logo">
                <a href="/">
                    <img src="images/footer-logo.svg" alt="WishCraft" class="light-theme-icon">
                    <img src="images/footer-logo-dark-theme.svg" alt="WishCraft" class="dark-theme-icon">
                </a>
            </div>
            <small class="copyright">&copy; WishCraft 2025</small>
        </div>
    </footer>
</body>
</html>
