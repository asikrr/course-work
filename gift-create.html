<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление товара</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-left">
                <img src="images/header-logo.svg" alt="Логотип">
            </div>
            <div class="header-center">
                <button class="theme-change-button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы">
                </button>
            </div>
            <div class="header-right">
                <nav>
                    <a href="/">Мои вишлисты</a>
                    <a href="/"><img src="images/avatar.svg" alt="Аватарка"></a>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section id="wishlist-create">
            <div class="wrapper">
                <h1>Добавление подарка</h1>
                <div id="gift-creation-form-container">
                    <form id="gift-creation-form">
                        <div id="gift-creation-form-top">
                            <input type="image">
                            <div class="form-fields">
                                <div class="form-field">
                                    <label for="title">Название</label>
                                    <input type="text" id="title" name="title">
                                </div>
                                <div class="form-field">
                                    <label for="price">Цена</label>
                                    <input type="text" id="price" name="price">
                                </div>
                                <div class="form-field">
                                    <label for="link">Ссылка</label>
                                    <input type="text" id="link" name="link">
                                </div>
                            </div>
                        </div>
                        <div id="gift-creation-form-bottom">
                            <div class="form-field">
                                <label for="gift-comment">Комментарий к подарку</label>
                                <textarea name="gift-comment" id="gift-comment"></textarea>
                            </div>
                        </div>
                        <button type="submit" id="save-button">Сохранить</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="logo-container">
                <img src="images/footer-logo.svg">
            </div>
            <p>&copy;WishCraft 2025</p>
        </div>
    </footer>
</body>
</html>
