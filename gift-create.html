<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление подарка</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/gift-form.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-logo">
                <a href="/"><img src="images/header-logo.svg" alt="WishCraft"></a>
            </div>
            <div class="header-controls">
                <button class="button-icon" type="button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы">
                </button>
                <nav class="menu">
                    <button type="button"><img src="images/default-avatar.svg" alt="Изображение профиля"></button>
                    <div class="dropdown">
                        <a href="profile.html" class="dropdown-item">Профиль</a>
                        <a href="my-wishlists.html" class="dropdown-item">Мои вишлисты</a>
                        <a href="notifications.html" class="dropdown-item">Уведомления</a>
                        <a href="friend-list.html" class="dropdown-item">Друзья</a>
                        <a href="reserved-gifts.html" class="dropdown-item">Забронированные подарки</a>
                        <div class="dropdown-divider"></div>   
                        <a href="/" class="dropdown-item logout">Выход</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="gift-create">
            <div class="wrapper">
                <h1 class="large-headline">Добавление подарка</h1>
                <div class="box">
                    <form id="gift-create-form" enctype="multipart/form-data" class="form-layout">
                        <div class="form-column-image">
                            <div class="image-upload-container">
                                <label for="gift-image-input" id="gift-image-label">
                                    <img src="images/add-photo-icon.svg" alt="Добавить фото">
                                </label>
                                <input type="file" id="gift-image-input" name="gift-image" accept="image/*">
                            </div>
                        </div>
                        <div class="form-column-content">
                            <div class="form-fields">
                                <div class="form-field">
                                    <label for="title">Название <span class="text-accent">*</span></label>
                                    <input type="text" id="title" name="title" required>
                                </div>
                                <div class="form-field">
                                    <label for="gift-link">Ссылка на товар</label>
                                    <input type="text" id="gift-link" name="gift-link">
                                </div>
                                <div class="price-container">
                                    <div class="form-field">
                                        <label for="price">Цена</label>
                                        <input type="text" id="price" name="price">
                                    </div>
                                    <select class="currency-select">
                                        <option>₽</option>
                                        <option>$</option>
                                        <option>€</option>
                                    </select>
                                </div>
                                <div class="form-field">
                                    <label for="gift-comment">Комментарий к подарку</label>
                                    <textarea name="gift-comment" id="gift-comment"></textarea>
                                </div>
                                <div class="checkbox-container">
                                    <input type="checkbox" id="priority-choice">
                                    <label for="priority-choice">Приоритетный товар</label>
                                </div>
                            </div>
                            <button type="submit" class="button button-accent">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="footer-logo">
                <a href="/"><img src="images/footer-logo.svg" alt="WishCraft"></a>
            </div>
            <p>&copy; WishCraft 2025</p>
        </div>
    </footer>
</body>
</html>
