<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование вишлиста</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-left">
                <a href="/"><img src="images/header-logo.svg" alt="Логотип"></a>
            </div>
            <div class="header-center">
                <button class="theme-change-button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы">
                </button>
            </div>
            <div class="header-right">
                <nav>
                    <a href="my-wishlists.html">Мои вишлисты</a>
                    <a href="/"><img src="images/default-avatar.svg" alt="Аватарка"></a>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section id="wishlist-create">
            <div class="wrapper">
                <h1>Редактирование вишлиста</h1>
                <div id="wishlist-creation-form-container">
                    <form id="wishlist-creation-form">
                        <div id="wishlist-creation-form-top">
                            <h4>Информация о вишлисте</h4>
                            <div class="form-fields">
                                <div id="form-fields-top">
                                    <div class="form-field">
                                        <label for="title">Название</label>
                                        <input type="text" id="title" name="title" value="Название списка">
                                    </div>
                                    <div class="form-field">
                                        <label for="date">Дата мероприятия</label>
                                        <input type="date" id="date" name="date" value="2025-12-31">
                                    </div>
                                </div>
                                <div id="form-fields-bottom">
                                    <label for="description">Описание</label>
                                    <textarea name="description" id="description">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor.</textarea>
                                </div>
                            </div>
                        </div>
                        <div id="wishlist-creation-form-middle">
                            <h4>Настройки</h4>
                            <div>
                                <p>Как будут отображаться забронированные подарки?</p>
                                <div id="wishlist-filter-choices">
                                    <div class="wishlist-filter-choice">
                                        <input type="radio" name="wishlist-filter-choice" value="show-names" id="choice-show-names" checked>
                                        <label for="choice-show-names">С именами</label>
                                    </div>
                                    <div class="wishlist-filter-choice">
                                        <input type="radio" name="wishlist-filter-choice" value="not-show-names" id="choice-not-show-names">
                                        <label for="choice-not-show-names">Без имен</label>
                                    </div>
                                    <div class="wishlist-filter-choice">
                                        <input type="radio" name="wishlist-filter-choice" value="show-nothing" id="choice-show-nothing">
                                        <label for="choice-show-nothing">Не показывать, какие подарки забронированы</label>
                                    </div>          
                                </div>
                            </div>
                        </div>
                        <div id="wishlist-creation-form-bottom">
                            <h4>Уведомления</h4>
                            <div>
                                <input type="checkbox" id="send-notifications">
                                <label for="send-notifications">Отправлять уведомления, когда подарок забронирован</label>
                            </div>
                        </div>
                        <button type="submit" id="save-button">Сохранить</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="logo-container">
                <a href="/"><img src="images/footer-logo.svg"></a>
            </div>
            <p>&copy;WishCraft 2025</p>
        </div>
    </footer>
</body>
</html>
