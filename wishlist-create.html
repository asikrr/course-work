<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание вишлиста</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/wishlist-form.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-logo">
                <a href="/"><img src="images/header-logo.svg" alt="WishCraft" class="light-theme-icon"></a>
                <a href="/"><img src="images/header-logo-dark-theme.svg" alt="WishCraft" class="dark-theme-icon"></a>
            </div>
            <div class="header-controls">
                <button class="button-icon" type="button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы" class="light-theme-icon">
                    <img src="images/light-theme-icon.svg" alt="Смена темы" class="dark-theme-icon">
                </button>
                <nav class="menu">
                    <button type="button">
                        <img src="images/default-avatar.svg" alt="Изображение профиля" class="light-theme-icon">
                        <img src="images/default-avatar-dark-theme.svg" alt="Изображение профиля" class="dark-theme-icon">
                    </button>
                    <div class="dropdown">
                        <a href="profile.html" class="dropdown-item">Профиль</a>
                        <a href="my-wishlists.html" class="dropdown-item">Мои вишлисты</a>
                        <a href="notifications.html" class="dropdown-item">Уведомления</a>
                        <a href="friend-list.html" class="dropdown-item">Друзья</a>
                        <a href="reserved-gifts.html" class="dropdown-item">Забронированные подарки</a>
                        <div class="dropdown-divider"></div>   
                        <a href="/" class="dropdown-item logout">Выход</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="wishlist-create">
            <div class="wrapper">
                <h1 class="large-headline">Создание вишлиста</h1>
                <div class="wishlist-form-container box">
                    <form id="wishlist-create-form">
                        <div class="wishlist-form-info">
                            <h2 class="small-headline">Информация о вишлисте</h2>
                            <div class="form-fields">
                                <div class="form-fields-main">
                                    <div class="form-field">
                                        <label for="title">Название <span class="text-accent">*</span></label>
                                        <input type="text" id="title" name="title" required>
                                    </div>
                                    <div class="form-field">
                                        <label for="date">Дата мероприятия</label>
                                        <input type="date" id="date" name="date">
                                    </div>
                                </div>
                                <div class="form-fields-description">
                                    <label for="description">Описание</label>
                                    <textarea name="description" id="description"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="wishlist-form-settings">
                            <h2 class="small-headline">Настройки</h2>
                            <div>
                                <p>Как будут отображаться забронированные подарки?</p>
                                <div id="reserved-gifts-display">
                                    <div class="reserved-gifts-display-choice">
                                        <input type="radio" name="reserved-gifts-display-choice" value="show-names" id="choice-show-names" checked>
                                        <label for="choice-show-names">С именами</label>
                                    </div>
                                    <div class="reserved-gifts-display-choice">
                                        <input type="radio" name="reserved-gifts-display-choice" value="not-show-names" id="choice-not-show-names">
                                        <label for="choice-not-show-names">Без имен</label>
                                    </div>
                                    <div class="reserved-gifts-display-choice">
                                        <input type="radio" name="reserved-gifts-display-choice" value="show-nothing" id="choice-show-nothing">
                                        <label for="choice-show-nothing">Не показывать, какие подарки забронированы</label>
                                    </div>          
                                </div>
                            </div>
                            <div>
                                <p>Кто видит вишлист?</p>
                                <div id="wishlist-visibility">
                                    <div class="wishlist-visibility-choice">
                                        <input type="radio" name="wishlist-visibility-choice" value="link-and-friends" id="choice-link-and-friends" checked>
                                        <label for="choice-link-and-friends">Те, у кого есть ссылка и друзья</label>
                                    </div>
                                    <div class="wishlist-visibility-choice">
                                        <input type="radio" name="wishlist-visibility-choice" value="only-friends" id="choice-only-friends">
                                        <label for="choice-only-friends">Только друзья</label>
                                    </div>
                                    <div class="wishlist-visibility-choice">
                                        <input type="radio" name="wishlist-visibility-choice" value="only-me" id="choice-only-me">
                                        <label for="choice-only-me">Только я</label>
                                    </div>          
                                </div>
                            </div>
                        </div>
                        <div class="wishlist-form-notifications">
                            <h2 class="small-headline">Уведомления</h2>
                            <div>
                                <input
                                    type="checkbox"
                                    id="send-notifications"
                                    name="send-notifications"
                                    value="yes">
                                <label for="send-notifications">Отправлять уведомления, когда подарок забронирован</label>
                            </div>
                        </div>
                        <button type="submit" class="button button-accent">Сохранить</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="footer-logo">
                <a href="/"><img src="images/footer-logo.svg" alt="WishCraft" class="light-theme-icon"></a>
                <a href="/"><img src="images/footer-logo-dark-theme.svg" alt="WishCraft" class="dark-theme-icon"></a>
            </div>
            <p>&copy; WishCraft 2025</p>
        </div>
    </footer>
</body>
</html>
