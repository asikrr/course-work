<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/error.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-logo">
                <a href="/"><img src="images/header-logo.svg" alt="WishCraft"></a>
            </div>
            <div class="header-controls">
                <button class="button-icon" type="button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы">
                </button>
                <nav class="menu">
                    <a href="login.html" class="button button-purple-border">Войти</a>
                    <a href="register.html" class="button button-yellow">Зарегистрироваться</a>
                    <button><img src="images/burger-menu-icon.svg" class="burger-menu"></button>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="error">
            <div class="wrapper">
                <h1 class="error-title">404</h1>
                <p class="error-text">Страница не найдена</p>
                <a href="/" class="button button-yellow">На главную</a>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="footer-logo">
                <a href="/"><img src="images/footer-logo.svg"></a>
            </div>
            <p>&copy; WishCraft 2025</p>
        </div>
    </footer>
</body>
</html>
