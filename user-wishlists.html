<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя Олег</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/wishlists.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-logo">
                <a href="/">
                    <img src="images/header-logo.svg" alt="WishCraft" class="light-theme-icon">
                    <img src="images/header-logo-dark-theme.svg" alt="WishCraft" class="dark-theme-icon">
                </a>
            </div>
            <div class="header-controls">
                <button class="button-icon" type="button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы" class="light-theme-icon">
                    <img src="images/light-theme-icon.svg" alt="Смена темы" class="dark-theme-icon">
                </button>
                <nav class="menu">
                    <button type="button">
                        <img src="images/default-avatar.svg" alt="Меню профиля" class="light-theme-icon">
                        <img src="images/default-avatar-dark-theme.svg" alt="Меню профиля" class="dark-theme-icon">
                    </button>
                    <div class="dropdown">
                        <a href="profile.html" class="dropdown-item">Профиль</a>
                        <a href="my-wishlists.html" class="dropdown-item">Мои вишлисты</a>
                        <a href="notifications.html" class="dropdown-item">Уведомления</a>
                        <a href="friends.html" class="dropdown-item">Друзья</a>
                        <a href="reserved-gifts.html" class="dropdown-item">Забронированные подарки</a>
                        <div class="dropdown-divider"></div>   
                        <a href="/" class="dropdown-item">Выход</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="user-wishlists">
            <div class="wrapper">
                <div class="wishlists-owner">
                    <img src="images/default-avatar.svg" alt="Изображение профиля" class="light-theme-icon">
                    <img src="images/default-avatar-dark-theme.svg" alt="Изображение профиля" class="dark-theme-icon">
                    <div class="wishlists-owner-info">
                        <h1 class="large-headline">Олег</h1>
                        <button class="button button-accent" type="button">Добавить в друзья</button>
                    </div>
                </div>
                <div class="wishlists-content">
                    <h2 class="medium-headline">Вишлисты пользователя</h2>
                    <div class="wishlists-sort">
                        <label for="sort-select">Сортировать</label>
                        <select id="sort-select" name="sort">
                            <option value="date">по дате мероприятия</option>
                            <option value="new">по новизне</option>
                        </select>
                    </div>
                    <div class="wishlists-container">
                        <article class="wishlist box">
                            <div class="wishlist-info">
                                <div class="wishlist-header">
                                    <div>
                                        <h3 class="small-headline">День рождения</h3>
                                        <p class="text-accent">10.10.2026</p>
                                    </div>
                                </div>
                                <div class="reserved-gifts-counter">
                                    <img src="images/lock-icon.svg" class="light-theme-icon" alt="Забронировано подарков">
                                    <img src="images/lock-icon-dark-theme.svg" class="dark-theme-icon" alt="Забронировано подарков">
                                    <p>2/6</p>
                                </div>
                            </div>
                            <div class="wishlist-items">
                                <a href="#" class="overlay-link"></a>
                                <div class="wishlist-item">
                                    <img src="images/watch-image.png" class="wishlist-item-image" alt="Фото подарка">
                                </div>
                                <div class="wishlist-item">
                                    <img src="images/speaker-image.png" class="wishlist-item-image" alt="Фото подарка">
                                </div>
                                <div class="wishlist-item">
                                    <img src="images/gift-icon.svg" class="wishlist-item-default light-theme-icon" alt="Иконка подарка">
                                    <img src="images/gift-icon-dark-theme.svg" class="wishlist-item-default dark-theme-icon" alt="Иконка подарка">
                                </div>
                                <div class="wishlist-item">
                                    <img src="images/gift-icon.svg" class="wishlist-item-default light-theme-icon" alt="Иконка подарка">
                                    <img src="images/gift-icon-dark-theme.svg" class="wishlist-item-default dark-theme-icon" alt="Иконка подарка">
                                </div>
                                <div class="wishlist-item">
                                    <img src="images/gift-icon.svg" class="wishlist-item-default light-theme-icon" alt="Иконка подарка">
                                    <img src="images/gift-icon-dark-theme.svg" class="wishlist-item-default dark-theme-icon" alt="Иконка подарка">
                                </div>
                                <div class="wishlist-item">
                                    <img src="images/gift-icon.svg" class="wishlist-item-default light-theme-icon" alt="Иконка подарка">
                                    <img src="images/gift-icon-dark-theme.svg" class="wishlist-item-default dark-theme-icon" alt="Иконка подарка">
                                </div>
                            </div>
                        </article>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="footer-logo">
                <a href="/">
                    <img src="images/footer-logo.svg" alt="WishCraft" class="light-theme-icon">
                    <img src="images/footer-logo-dark-theme.svg" alt="WishCraft" class="dark-theme-icon">
                </a>
            </div>
            <small class="copyright">&copy; WishCraft 2025</small>
        </div>
    </footer>
</body>
</html>
