<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Профиль пользователя</title>
    <link rel="stylesheet" href="css/style.css">

<body>
    <header>
        <div class="wrapper">
            <div class="header-left">
                <a href="/"><img src="images/header-logo.svg" alt="Логотип"></a>
            </div>
            <div class="header-center">
                <button class="theme-change-button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы">
                </button>
            </div>
            <div class="header-right">
                <nav>
                    <a href="my-wishlists.html">Мои вишлисты</a>

            </div>
        </div>

        <section id="user-wishlists">

                    <img src="images/default-avatar.svg">

                            <option>по новизне</option>
                        </select>
                    </div>
                    <div class="wishlists-container">
                        <article class="container wishlist">

                                <div class="wishlist-header">
                                    <div>
                                        <h4>Название списка</h4>
                                        <p>31.12.2025</p>
                                    </div>
                                    <img src="images/action-menu-icon.svg">
                                </div>
                                <div id="reserved-gifts-counter">
                                    <img src="images/lock-icon.svg">
                                    <p>1/4</p>
                                </div>
                            </div>
                            <div class="wishlist-items">
                                <div class="wishlist-item">

                            </div>

                        <article class="container wishlist">

                                    <div>
