<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/wishlists.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-logo">
                <a href="/"><img src="images/header-logo.svg" alt="WishCraft"></a>
            </div>
            <div class="header-controls">
                <button class="button-icon" type="button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы">
                </button>
                <nav class="menu">
                    <button type="button"><img src="images/default-avatar.svg" alt="Изображение профиля"></button>
                    <div class="dropdown">
                        <a href="profile.html" class="dropdown-item">Профиль</a>
                        <a href="my-wishlists.html" class="dropdown-item">Мои вишлисты</a>
                        <a href="notifications.html" class="dropdown-item">Уведомления</a>
                        <a href="friend-list.html" class="dropdown-item">Друзья</a>
                        <a href="reserved-gifts.html" class="dropdown-item">Забронированные подарки</a>
                        <div class="dropdown-divider"></div>   
                        <a href="/" class="dropdown-item logout">Выход</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="user-wishlists">
            <div class="wrapper">
                <div class="wishlists-owner">
                    <img src="images/default-avatar.svg">
                    <div class="wishlists-owner-info">
                        <h1>Олег</h1>
                        <button class="button button-yellow">Добавить в друзья</button>
                    </div>
                </div>
                <div class="wishlists-content">
                    <h2>Вишлисты пользователя</h2>
                    <div class="wishlists-sort">
                        <label for="sort-select">Сортировать</label>
                        <select id="sort-select" name="sort">
                            <option value="date">по дате мероприятия</option>
                            <option value="new">по новизне</option>
                        </select>
                    </div>
                    <div class="wishlists-container">
                        <article class="box wishlist">
                            <div class="wishlist-info">
                                <div class="wishlist-header">
                                    <div>
                                        <h3>День рождения</h3>
                                        <p class="text-accent">10.10.2026</p>
                                    </div>
                                </div>
                                <div class="reserved-gifts-counter">
                                    <img src="images/lock-icon.svg">
                                    <p>2/6</p>
                                </div>
                            </div>
                            <div class="wishlist-items">
                                <a href="#" class="overlay-link"></a>
                                <div class="wishlist-item">
                                    <img src="images/watch-image.png" class="wishlist-item-image" alt="Фото подарка">
                                </div>
                                <div class="wishlist-item">
                                    <img src="images/speaker-image.png" class="wishlist-item-image" alt="Фото подарка">
                                </div>
                                <div class="wishlist-item">
                                    <img src="images/gift-icon.svg" alt="Фото подарка">
                                </div>
                                <div class="wishlist-item">
                                    <img src="images/gift-icon.svg" alt="Фото подарка">
                                </div>
                                <div class="wishlist-item">
                                    <img src="images/gift-icon.svg" alt="Фото подарка">
                                </div>
                                <div class="wishlist-item">
                                    <img src="images/gift-icon.svg" alt="Фото подарка">
                                </div>
                            </div>
                        </article>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="footer-logo">
                <a href="/"><img src="images/footer-logo.svg" alt="WishCraft"></a>
            </div>
            <p>&copy; WishCraft 2025</p>
        </div>
    </footer>
</body>
</html>
