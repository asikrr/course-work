<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Друзья</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-logo">
                <a href="/"><img src="images/header-logo.svg" alt="WishCraft"></a>
            </div>
            <div class="header-controls">
                <button class="button-icon" type="button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы">
                </button>
                <nav class="menu">
                    <button type="button"><img src="images/default-avatar.svg" alt="Изображение профиля"></button>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="friend-list">
            <div class="wrapper">
                <input id="tab-my-friends" class="tabs-toggle" name="tab-button" type="radio" value="my-friends" checked>
                <input id="tab-friend-requests" class="tabs-toggle" name="tab-button" type="radio" value="friend-requests">
                <div class="friend-list-header">
                    <h1>Друзья</h1>
                    <div class="friend-list-header-controls">
                        <div class="tabs">
                            <label for="tab-my-friends">Мои друзья</label>
                            <label for="tab-friend-requests">Заявки</label>
                        </div>
                        <button type="button" class="button button-yellow">Добавить друга</button>
                    </div>
                </div>
                <div class="friend-list-content">
                    <div class="tab-content" id="tab-content-my-friends">
                        <div class="friend-list-items">
                            <div class="friend-list-item box">
                                <div class="friend-info">
                                    <img src="images/default-avatar.svg" alt="Изображение профиля">
                                    <p>Олег</p>
                                </div>
                                <button class="button-icon" type="button">
                                    <img src="images/trash-can-icon.svg" alt="">
                                </button>
                            </div>
                            <div class="friend-list-item box">
                                <div class="friend-info">
                                    <img src="images/default-avatar.svg" alt="Изображение профиля">
                                    <p>Алиса</p>
                                </div>
                                <button class="button-icon" type="button">
                                    <img src="images/trash-can-icon.svg" alt="">
                                </button>
                            </div>
                            <div class="friend-list-item box">
                                <div class="friend-info">
                                    <img src="images/default-avatar.svg" alt="Изображение профиля">
                                    <p>Даша</p>
                                </div>
                                <button class="button-icon" type="button">
                                    <img src="images/trash-can-icon.svg" alt="">
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="tab-content" id="tab-content-friend-requests">
                        <p>Список заявок пуст</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="footer-logo">
                <a href="/"><img src="images/footer-logo.svg" alt="WishCraft"></a>
            </div>
            <p>&copy; WishCraft 2025</p>
        </div>
    </footer>
</body>
</html>
