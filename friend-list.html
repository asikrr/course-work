<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Друзья</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/friend-list.css">
</head>
<body>
    <header>
        <div class="wrapper">
            <div class="header-logo">
                <a href="/"><img src="images/header-logo.svg" alt="WishCraft"></a>
            </div>
            <div class="header-controls">
                <button class="button-icon" type="button">
                    <img src="images/dark-theme-icon.svg" alt="Смена темы">
                </button>
                <nav class="menu">
                    <button type="button"><img src="images/default-avatar.svg" alt="Изображение профиля"></button>
                    <div class="dropdown">
                        <a href="profile.html" class="dropdown-item">Профиль</a>
                        <a href="my-wishlists.html" class="dropdown-item">Мои вишлисты</a>
                        <a href="notifications.html" class="dropdown-item">Уведомления</a>
                        <a href="friend-list.html" class="dropdown-item">Друзья</a>
                        <a href="reserved-gifts.html" class="dropdown-item">Забронированные подарки</a>
                        <div class="dropdown-divider"></div>   
                        <a href="/" class="dropdown-item">Выход</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="friend-list">
            <div class="wrapper">
                <div class="friend-list-header">
                    <h1 class="large-headline">Друзья</h1>
                    <div class="friend-list-header-controls">
                        <div class="tabs">
                            <button class="tab active" type="button" data-target="my-friends">Мои друзья</button>
                            <button class="tab" type="button" data-target="friend-requests">Заявки</button>
                        </div>
                        <button type="button" class="button button-accent">Добавить друга</button>
                    </div>
                </div>
                <div class="friend-list-content">
                    <div class="tab-content active" id="my-friends">
                        <div class="friend-list-items">
                            <div class="friend-list-item box">
                                <div class="friend-info">
                                    <img src="images/default-avatar.svg" alt="Изображение профиля">
                                    <p>Олег</p>
                                </div>
                                <button class="button-icon" type="button">
                                    <img src="images/trash-can-icon.svg" alt="">
                                </button>
                            </div>
                            <div class="friend-list-item box">
                                <div class="friend-info">
                                    <img src="images/default-avatar.svg" alt="Изображение профиля">
                                    <p>Алиса</p>
                                </div>
                                <button class="button-icon" type="button">
                                    <img src="images/trash-can-icon.svg" alt="">
                                </button>
                            </div>
                            <div class="friend-list-item box">
                                <div class="friend-info">
                                    <img src="images/default-avatar.svg" alt="Изображение профиля">
                                    <p>Даша</p>
                                </div>
                                <button class="button-icon" type="button">
                                    <img src="images/trash-can-icon.svg" alt="">
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="tab-content" id="friend-requests">
                        <p>Список заявок пуст</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrapper">
            <div class="footer-logo">
                <a href="/"><img src="images/footer-logo.svg" alt="WishCraft"></a>
            </div>
            <p>&copy; WishCraft 2025</p>
        </div>
    </footer>
</body>
</html>
